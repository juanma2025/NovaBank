# Infraestructura de desarrollo de Nova (research R15). Uso: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: nova-postgres
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - '5433:5432' # 5433 en el host: evita choques con un PostgreSQL instalado localmente
    volumes:
      - nova-pgdata:/var/lib/postgresql/data
      # Crea nova_test (integración) y nova_e2e (Playwright) la primera vez.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nova']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: nova-mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Interfaz web y API

volumes:
  nova-pgdata:
