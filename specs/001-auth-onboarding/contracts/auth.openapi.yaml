openapi: 3.1.0
info:
  title: Nova API — Autenticación y registro (spec 001)
  version: 1.0.0
  description: |
    Contrato de diseño de la funcionalidad 001-auth-onboarding. Es la fuente de verdad entre
    backend y frontend: el documento generado en `/api/v1/openapi.json` DEBE coincidir con él.

    Cookies (todas HttpOnly, Secure, SameSite=Strict):
    - `nova_at`: JWT de acceso, Path=/api, 15 min.
    - `nova_rt`: refresh token, Path=/api/v1/auth, hasta el vencimiento absoluto de la sesión.
    - `nova_vf`: token del flujo de verificación, Path=/api/v1/auth, 45 min.
    - `nova_dev`: identificador de dispositivo para el bloqueo por intentos, Path=/api/v1/auth, 1 año.

    Todo error usa el esquema `ErrorResponse`. Los mensajes van en español.
servers:
  - url: /api/v1
tags:
  - name: health
  - name: registration
  - name: verification
  - name: password-reset
  - name: session

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /auth/register:
    post:
      tags: [registration]
      operationId: startRegistration
      summary: Paso 1 del registro — correo institucional y aceptación de datos
      description: |
        Crea un flujo de registro y emite la cookie `nova_vf`. Responde igual si el correo ya
        tiene cuenta (en ese caso se envía un aviso en lugar del código). Reemplaza cualquier
        flujo de registro anterior del mismo correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRegistrationRequest' }
      responses:
        '202':
          description: Flujo creado; el código (o el aviso) se envía de forma asíncrona
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetFlowCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: '`DOMAIN_NOT_ALLOWED` o `POLICY_VERSION_OUTDATED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset:
    post:
      tags: [password-reset]
      operationId: startPasswordReset
      summary: Paso 1 de la recuperación — correo
      description: |
        Crea un flujo de recuperación y emite la cookie `nova_vf`. Responde igual exista o no la
        cuenta; solo envía el código si existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartPasswordResetRequest' }
      responses:
        '202':
          description: Flujo creado
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetFlowCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verification:
    get:
      tags: [verification]
      operationId: getVerification
      summary: Estado del flujo de verificación en curso (para retomar tras recargar)
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowCookie'
      responses:
        '200':
          description: Flujo vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '404': { $ref: '#/components/responses/VerificationNotFound' }

  /auth/verify-email:
    post:
      tags: [verification]
      operationId: verifyEmail
      summary: Paso 2 — verificar el código (registro o recuperación)
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        '200':
          description: Código correcto; el flujo pasa al paso `complete`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/VerificationNotFound' }
        '409': { $ref: '#/components/responses/VerificationStepInvalid' }
        '422':
          description: |
            `CODE_INVALID` (details.attemptsLeft), `CODE_EXPIRED` o `CODE_ATTEMPTS_EXHAUSTED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/resend-verification:
    post:
      tags: [verification]
      operationId: resendVerification
      summary: Pedir un código nuevo; invalida el anterior
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowCookie'
      responses:
        '202':
          description: Código nuevo encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationState' }
        '404': { $ref: '#/components/responses/VerificationNotFound' }
        '409': { $ref: '#/components/responses/VerificationStepInvalid' }
        '429':
          description: |
            `RESEND_TOO_SOON` (details.retryAfterSeconds), `CODE_SEND_LIMIT`
            (details.retryAfterSeconds) o `RATE_LIMITED`
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/register/complete:
    post:
      tags: [registration]
      operationId: completeRegistration
      summary: Paso 3 del registro — nombre y contraseña; crea la cuenta e inicia sesión
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRegistrationRequest' }
      responses:
        '201':
          description: Cuenta creada y sesión iniciada; se borra `nova_vf`
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/VerificationNotFound' }
        '409':
          description: '`VERIFICATION_STEP_INVALID` o `EMAIL_ALREADY_REGISTERED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`VERIFICATION_EXPIRED` o `PASSWORD_WEAK` (details.reasons)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/password-reset/complete:
    post:
      tags: [password-reset]
      operationId: completePasswordReset
      summary: Paso 3 de la recuperación — contraseña nueva
      description: |
        Cambia la contraseña, revoca todas las sesiones del estudiante, borra sus bloqueos por
        intentos fallidos, encola el aviso de cambio y borra `nova_vf`. No inicia sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePasswordResetRequest' }
      responses:
        '204':
          description: Contraseña cambiada
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/VerificationNotFound' }
        '409': { $ref: '#/components/responses/VerificationStepInvalid' }
        '422':
          description: '`VERIFICATION_EXPIRED` o `PASSWORD_WEAK` (details.reasons)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      tags: [session]
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS` (mismo mensaje exista o no el correo)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: '`LOGIN_LOCKED` (details.retryAfterSeconds) o `RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      tags: [session]
      operationId: refreshSession
      summary: Renovar el acceso y registrar actividad («Seguir conectado»)
      description: |
        Rota `nova_rt` y emite un `nova_at` nuevo. Si llega el refresh token anterior dentro de
        los 10 s siguientes a una rotación, responde 200 sin emitir cookies (la otra pestaña ya
        las recibió). Fuera de esa ventana se considera reuso y la sesión se revoca.
      security: []
      parameters:
        - in: cookie
          name: nova_rt
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sesión renovada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/SessionInvalid' }

  /auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Cerrar sesión en este dispositivo
      description: Idempotente. Revoca la sesión del `nova_rt` (si existe) y borra las cookies.
      security: []
      responses:
        '204':
          description: Sesión cerrada

  /auth/session:
    get:
      tags: [session]
      operationId: getSession
      summary: Estudiante y sesión actual
      security:
        - accessCookie: []
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/SessionInvalid' }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: nova_at

  parameters:
    FlowCookie:
      in: cookie
      name: nova_vf
      required: true
      schema: { type: string }

  headers:
    SetFlowCookie:
      description: 'nova_vf=<token>; Path=/api/v1/auth; Max-Age=2700; HttpOnly; Secure; SameSite=Strict'
      schema: { type: string }
    SetSessionCookies:
      description: |
        nova_at=<jwt>; Path=/api; Max-Age=900; HttpOnly; Secure; SameSite=Strict
        nova_rt=<token>; Path=/api/v1/auth; Max-Age=<hasta absoluteExpiresAt>; HttpOnly; Secure; SameSite=Strict
      schema: { type: string }
    RetryAfter:
      description: Segundos hasta poder reintentar
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR` — details.fields con el error de cada campo'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: '`CODE_SEND_LIMIT` (details.retryAfterSeconds) o `RATE_LIMITED`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    VerificationNotFound:
      description: '`VERIFICATION_NOT_FOUND` — no hay flujo vigente en este navegador'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    VerificationStepInvalid:
      description: '`VERIFICATION_STEP_INVALID` — la acción no corresponde al paso actual'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SessionInvalid:
      description: |
        `UNAUTHENTICATED`, `ACCESS_TOKEN_EXPIRED` (el cliente debe llamar a /auth/refresh) o
        `SESSION_EXPIRED` (details.reason: idle | absolute | revoked)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    InstitutionalEmail:
      type: string
      format: email
      maxLength: 254
      description: Se normaliza (trim + minúsculas) antes de validar el dominio
      examples: ['ana.perez@ucc.edu.co']

    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: No puede contener el correo ni su parte local, ni estar en la lista de contraseñas comunes

    StartRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, acceptedPolicyVersion]
      properties:
        email: { $ref: '#/components/schemas/InstitutionalEmail' }
        acceptedPolicyVersion:
          type: string
          maxLength: 20
          description: Versión vigente de la política de datos que la persona aceptó
          examples: ['2026-11-20']

    StartPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/InstitutionalEmail' }

    VerifyCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    CompleteRegistrationRequest:
      type: object
      additionalProperties: false
      required: [fullName, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          pattern: "^[\\p{L}][\\p{L} '\\-]*[\\p{L}]$"
        password: { $ref: '#/components/schemas/Password' }

    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { $ref: '#/components/schemas/Password' }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    VerificationState:
      type: object
      required: [purpose, step, maskedEmail, codeExpiresAt, resendAvailableAt, attemptsLeft, completeBy]
      properties:
        purpose: { type: string, enum: [registration, password_reset] }
        step:
          type: string
          enum: [code, complete]
          description: '`code` = falta ingresar el código; `complete` = falta nombre/contraseña'
        maskedEmail: { type: string, examples: ['an***@ucc.edu.co'] }
        codeExpiresAt: { type: string, format: date-time }
        resendAvailableAt: { type: string, format: date-time }
        attemptsLeft: { type: integer, minimum: 0, maximum: 5 }
        completeBy:
          type: [string, 'null']
          format: date-time
          description: Límite para el paso 3; null mientras step = code

    User:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }

    SessionInfo:
      type: object
      required: [idleTimeoutSeconds, idleWarningSeconds, lastActivityAt, absoluteExpiresAt]
      properties:
        idleTimeoutSeconds:
          type: integer
          minimum: 1
          description: 900 en producción; solo en desarrollo y E2E puede reducirse por configuración
        idleWarningSeconds:
          type: integer
          minimum: 1
          description: 60 en producción; el aviso aparece idleTimeoutSeconds − idleWarningSeconds después de la última actividad
        lastActivityAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }

    SessionResponse:
      type: object
      required: [user, session]
      properties:
        user: { $ref: '#/components/schemas/User' }
        session: { $ref: '#/components/schemas/SessionInfo' }

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - DOMAIN_NOT_ALLOWED
        - POLICY_VERSION_OUTDATED
        - VERIFICATION_NOT_FOUND
        - VERIFICATION_STEP_INVALID
        - VERIFICATION_EXPIRED
        - CODE_INVALID
        - CODE_EXPIRED
        - CODE_ATTEMPTS_EXHAUSTED
        - RESEND_TOO_SOON
        - CODE_SEND_LIMIT
        - PASSWORD_WEAK
        - EMAIL_ALREADY_REGISTERED
        - INVALID_CREDENTIALS
        - LOGIN_LOCKED
        - UNAUTHENTICATED
        - ACCESS_TOKEN_EXPIRED
        - SESSION_EXPIRED
        - RATE_LIMITED
        - NOT_FOUND
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Texto en español para el usuario }
            requestId: { type: string, format: uuid }
            details:
              type: object
              description: Datos opcionales para que la interfaz reaccione
              properties:
                attemptsLeft: { type: integer, minimum: 0 }
                retryAfterSeconds: { type: integer, minimum: 1 }
                reason: { type: string, enum: [idle, absolute, revoked] }
                reasons:
                  type: array
                  items: { type: string, enum: [too_short, too_long, contains_email, common] }
                fields:
                  type: object
                  additionalProperties: { type: string }
